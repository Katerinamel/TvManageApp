<main class="not-found">
  <section class="not-found-card">
    <div class="illustration" aria-hidden="true">
      <span class="screen">
        <span class="screen-code">404</span>
      </span>
      <span class="stand"></span>
    </div>

    <p class="eyebrow">СТРАНИЦА НЕ НАЙДЕНА</p>
    <h1>Такой страницы не существует</h1>
    <p class="description">
      Возможно, адрес введён с ошибкой или страница была перемещена. Вернитесь к списку
      телевизоров и продолжите работу.
    </p>

    <div class="actions">
      <a nz-button nzType="primary" nzSize="large" routerLink="/televisions">
        К телевизорам
      </a>
      <a nz-button nzSize="large" routerLink="/televisions/connect">
        Добавить телевизор
      </a>
    </div>
  </section>
</main>

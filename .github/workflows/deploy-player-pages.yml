name: Deploy Player to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        # npm's Linux dependency resolver crashes while reading the current
        # cross-platform lockfile. Pages only needs a disposable clean build,
        # so resolve directly from package.json without rewriting the lockfile.
        run: npm install --legacy-peer-deps --package-lock=false --no-audit --no-fund

      - name: Build Player
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npx ng build player --configuration production --base-href "/${REPOSITORY_NAME}/"

      - name: Prepare Pages artifact
        run: touch dist/player/browser/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/player/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
